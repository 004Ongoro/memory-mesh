<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradFull" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A12" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="320" rx="24" fill="url(#bgGradFull)" stroke="#1F293D" stroke-width="1.5" />

  <!-- Embedded Logo Mark shifted to left (x=160, y=160, scale=0.48) -->
  <g transform="translate(48, 32) scale(0.5)">
    <!-- Outer Ambient Radial Halo -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="6 8" opacity="0.3" />
    <circle cx="256" cy="256" r="140" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.25" />

    <!-- Arcs -->
    <path d="M 256,108 Q 330,170 388,172" fill="none" stroke="#06B6D4" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M 388,172 Q 410,270 376,360" fill="none" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 376,360 Q 256,410 136,360" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M 136,360 Q 102,270 124,172" fill="none" stroke="#F43F5E" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 124,172 Q 182,170 256,108" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Center bridges -->
    <path d="M 256,256 L 256,108" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
    <path d="M 256,256 L 388,172" fill="none" stroke="#818CF8" stroke-width="5" stroke-linecap="round" />
    <path d="M 256,256 L 376,360" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" />
    <path d="M 256,256 L 136,360" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round" />
    <path d="M 256,256 L 124,172" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />

    <!-- Nodes -->
    <circle cx="256" cy="108" r="22" fill="#06B6D4" />
    <circle cx="256" cy="108" r="8" fill="#FFFFFF" />
    <circle cx="388" cy="172" r="20" fill="#6366F1" />
    <circle cx="388" cy="172" r="7" fill="#FFFFFF" />
    <circle cx="376" cy="360" r="20" fill="#10B981" />
    <circle cx="376" cy="360" r="7" fill="#FFFFFF" />
    <circle cx="136" cy="360" r="20" fill="#F43F5E" />
    <circle cx="136" cy="360" r="7" fill="#FFFFFF" />
    <circle cx="124" cy="172" r="20" fill="#F59E0B" />
    <circle cx="124" cy="172" r="7" fill="#FFFFFF" />

    <!-- Center Core -->
    <circle cx="256" cy="256" r="48" fill="#0B0F19" stroke="#818CF8" stroke-width="4" />
    <circle cx="256" cy="256" r="28" fill="#818CF8" />
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="350" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-1" fill="url(#textGrad)">Memory<tspan fill="#818CF8">Mesh</tspan></text>

  <rect x="352" y="172" width="520" height="3" fill="url(#accentGrad)" rx="1.5" />

  <text x="352" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="1.5">OFFLINE-FIRST KNOWLEDGE GRAPH &amp; SYNAPTIC LEARNING</text>

  <!-- Feature Pills -->
  <g transform="translate(352, 245)">
    <!-- Pill 1 -->
    <rect width="115" height="30" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="1" />
    <text x="57" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#06B6D4" text-anchor="middle">Force Graph</text>

    <!-- Pill 2 -->
    <rect x="125" width="105" height="30" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="#6366F1" stroke-width="1" />
    <text x="177" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#818CF8" text-anchor="middle">SM-2 Recall</text>

    <!-- Pill 3 -->
    <rect x="240" width="105" height="30" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1" />
    <text x="292" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">100% Offline</text>

    <!-- Pill 4 -->
    <rect x="355" width="115" height="30" rx="8" fill="rgba(244, 63, 94, 0.15)" stroke="#F43F5E" stroke-width="1" />
    <text x="412" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F43F5E" text-anchor="middle">Auto-Synapse</text>
  </g>
</svg>
